name: CI

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  test:
    name: Test (pytest, no Docker)
    runs-on: ubuntu-latest
    needs: lint

    env:
      # Provide a minimal environment so app config can import
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install all dependencies (dev + test)
        run: uv sync --group dev --group test

      - name: Run pytest (skip Docker tests)
        run: uv run pytest -v -m "not docker" --tb=short
